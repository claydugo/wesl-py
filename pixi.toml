[workspace]
name = "wesl-py"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
rust = ">=1.97.1"
maturin = "*"
pytest = "*"
ruff = "*"
ty = "*"
cargo-machete = ">=0.9.1,<0.10"
cargo-deny = ">=0.20.2,<0.21"
cargo-audit = ">=0.22.1,<0.23"
cargo-bundle-licenses = "*"
pyyaml = "*"

[pypi-dependencies]
wesl-py = { path = ".", editable = true }

[pypi-options]
no-build-isolation = ["wesl-py"]

[feature.gpu.dependencies]
wgpu-py = ">=0.31.1"

[feature.fractal.dependencies]
imageio = ">=2.37"
numpy = "*"

[feature.compute.dependencies]
imageio = ">=2.37"
numpy = "*"

[feature.examples.pypi-dependencies]
wesl-py = { path = ".", editable = true, extras = ["examples"] }

[feature.examples.dependencies]
imageio = ">=2.37"
imgui-bundle = ">=1.92.900"
numpy = "*"
pygfx = ">=0.17"
pyglfw = "*"
rendercanvas = "*"
tifffile = "*"

[feature.dev.pypi-dependencies]
wesl-py = { path = ".", editable = true, extras = ["dev"] }

[feature.dev.dependencies]
mypy = "*"

[feature.dev.tasks]
stubtest = "python -m mypy.stubtest wesl --concise"

[environments]
default = { solve-group = "default" }
gpu = { features = ["gpu"], solve-group = "default" }
compute = { features = ["gpu", "compute"], solve-group = "default" }
fractal = { features = ["gpu", "fractal"], solve-group = "default" }
examples = { features = ["gpu", "examples"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tasks]
lint = "ruff check python tests tools examples recipe"
format = "ruff format python tests tools examples recipe"
format-check = "ruff format --check python tests tools examples recipe"
rust-format-check = "cargo fmt --all --check"
clippy = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"
machete = "cargo machete ./Cargo.toml"
deny = "cargo deny --locked --workspace --all-features check"
audit = "cargo audit"
licenses = "python tools/test_licenses.py"
benchmark = "python tools/benchmark.py"
profile-startup = "python tools/profile_startup.py"
