[workspace]
name = "wesl-py"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
wesl-py = { path = ".", editable = true }

[pypi-options]
no-build-isolation = ["wesl-py"]

[feature.build.dependencies]
rust = ">=1.97.1"
maturin = ">=1.15,<2"

[feature.artifacts.dependencies]
abi3audit = "*"
twine = "*"

[feature.artifacts.target.osx-arm64.dependencies]
delocate = "*"

[feature.artifacts.target.win-64.dependencies]
delvewheel = "*"

[feature.artifacts.target.osx-arm64.activation.env]
MACOSX_DEPLOYMENT_TARGET = "11.0"

[feature.test.dependencies]
pytest = ">=8.2"

[feature.gpu.dependencies]
numpy = ">=1.26"
wgpu-py = "==0.32.0"

[feature.examples.dependencies]
imageio = ">=2.37"
imgui-bundle = ">=1.92.801,<1.92.900"
numpy = ">=2.1"
pygfx = ">=0.17"
pyglfw = ">=2.7"
rendercanvas = ">=2.7.2"
tifffile = ">=2024.8.30"

[feature.dev.dependencies]
ruff = ">=0.16.7"
cargo-machete = ">=0.9.1,<0.10"
cargo-deny = ">=0.20.2,<0.21"
mypy = ">=1.15"
ty = ">=0.0.80"
pyrefly = ">=1.3"
pyright = ">=1.1.400"

[feature.testing.pypi-dependencies]
wesl-py = { path = ".", editable = true, extras = ["testing"] }

[feature.testing.dependencies]
pytest-regressions = ">=2.5"
pytest-xdist = ">=3.6"

[feature.pytest-minimum.dependencies]
pytest = "==8.2.0"

[feature.freethreading]
channels = ["conda-forge", "conda-forge/label/python_rc"]

[feature.freethreading.dependencies]
python = "3.15.*"
python-freethreading = "*"
pytest = ">=8.2"

[feature.freethreading.pypi-dependencies]
wesl-py = { path = "." }

[feature.freethreading.tasks]
test-freethreading = "python -m pytest tests/test_threading.py tests/test_compile.py::test_concurrent_feature_state_isolation tests/test_diagnostics.py::test_concurrent_diagnostics_remain_independent"

[environments]
default = { features = ["build"], platforms = ["linux-64"], solve-group = "default" }
test = { features = ["build", "test"], platforms = ["linux-64"], solve-group = "default" }
gpu = { features = ["build", "test", "gpu"], platforms = ["linux-64"], solve-group = "default" }
examples = { features = ["build", "gpu", "examples"], platforms = ["linux-64"], solve-group = "default" }
dev = { features = ["build", "dev", "test", "gpu"], platforms = ["linux-64"], solve-group = "default" }
testing = { features = ["build", "test", "gpu", "examples", "testing"], platforms = ["linux-64"], solve-group = "default" }
testing-minimum = { features = ["build", "test", "gpu", "testing", "pytest-minimum"], platforms = ["linux-64"] }
freethreading = { features = ["build", "freethreading"], platforms = ["linux-64"], no-default-feature = true }

[environments.artifacts]
features = ["build", "artifacts"]
no-default-feature = true
dependencies = { python = "3.12.*" }

[tasks]
test = { cmd = "cargo test --locked --workspace --all-features && python -m pytest", default-environment = "testing" }
format = { cmd = "ruff format . && cargo fmt --all", default-environment = "dev" }
format-check = { cmd = "ruff format --check . && cargo fmt --all --check", default-environment = "dev" }
check-dependencies = { cmd = "cargo machete ./Cargo.toml && cargo deny --locked --workspace --all-features check", default-environment = "dev" }

[tasks.lint]
default-environment = "dev"
cmd = """
ruff check . &&
cargo clippy --locked --workspace --all-targets --all-features -- -D warnings &&
ty check python/wesl &&
pyrefly check python/wesl &&
pyright python/wesl &&
python -m mypy.stubtest wesl._native --concise
"""
