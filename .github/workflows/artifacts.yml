name: Artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Check source / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            environments: lint rust dev test
          - runner: macos-26
            environments: rust test
          - runner: windows-2025
            environments: rust test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.80.0
          environments: ${{ matrix.environments }}
          locked: true
      - run: pixi run --locked lint
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pixi run --locked check-rust
      - run: pixi run --locked check-types
        if: runner.os == 'Linux'
      - run: pixi run --locked generate-stubs
        if: runner.os == 'Linux'
      - run: git diff --exit-code -- python/wesl/_native.pyi
        if: runner.os == 'Linux'
      - run: pixi run --locked -e test cargo test --locked --test upstream
        env:
          DYLD_FALLBACK_LIBRARY_PATH: ${{ github.workspace }}/.pixi/envs/test/lib
      - run: pixi run --locked -e test python -m pytest tests/test_pytest_plugin.py::test_import_preserves_metadata_without_gpu_dependencies tests/test_shader_compilation.py::test_concurrent_shader_instrumentation tests/test_compile.py::test_feature_policies_and_call_overrides tests/test_diagnostics.py::test_compile_errors_survive_pickling_and_threads -q
      - run: pixi run --locked check-dependencies
        if: runner.os == 'Linux'

  sdist:
    name: Build source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.80.0
          environments: artifacts
          locked: true
          cache: false
      - run: pixi run --locked -e artifacts maturin sdist --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
      - run: pixi run --locked -e artifacts twine check --strict dist/*.tar.gz
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.22"
          enable-cache: false
          python-version: "3.12"
          activate-environment: true
      - name: Install minimum Rust version
        run: |
          rust_version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')
          rustup toolchain install "$rust_version" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$rust_version" >> "$GITHUB_ENV"
      - name: Install source distribution
        run: uv pip install dist/*.tar.gz
      - run: uv pip check
      - name: Test source installation
        run: |
          python - <<'PY'
          import sys
          from importlib.metadata import version
          from importlib.util import find_spec
          from pathlib import Path
          import wesl

          assert wesl.__version__ == version("wesl-py")
          assert Path(wesl.__file__).is_relative_to(sys.prefix)
          assert Path(wesl.__file__).with_name("py.typed").is_file()
          assert Path(wesl.__file__).with_name("_native.pyi").is_file()
          assert "wgpu" not in sys.modules
          assert "fn main(" in wesl.compile_source("@compute @workgroup_size(1) fn main() {}").wgsl
          shader = wesl.compile_source(
              "import wgsl_test::expect; @compute @workgroup_size(1) fn main() { expect(true); }"
          )
          assert "wgsl_test" in shader.modules
          assert find_spec("maturin") is None
          PY

  wheel-linux:
    name: Build wheels / ${{ matrix.target }}
    needs: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.80.0
          environments: artifacts
          locked: true
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: sdist
      - name: Extract source archive
        shell: bash
        run: |
          mkdir source
          tar -xf sdist/*.tar.gz -C source --strip-components=1
      - name: Read locked build tool versions
        id: build-tools
        run: |
          echo "rust=$(pixi run --locked -e artifacts rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
          echo "maturin=$(pixi run --locked -e artifacts maturin --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v${{ steps.build-tools.outputs.maturin }}
          rust-toolchain: ${{ steps.build-tools.outputs.rust }}
          target: ${{ matrix.target }}
          manylinux: "2_28"
          working-directory: source
          args: --release --locked --compatibility pypi --out ../dist -i python3.12
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          overwrite: true
      - run: pixi run --locked -e artifacts twine check --strict dist/*.whl
      - name: Check wheel contents
        shell: bash
        run: pixi run --locked -e artifacts check-wheel-contents --config pyproject.toml dist/*.whl
      - name: Audit Python ABI
        shell: bash
        run: pixi run --locked -e artifacts abi3audit --strict --summary dist/*-cp312-abi3-*.whl

  wheel:
    name: Build wheels / ${{ matrix.target }}
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.80.0
          environments: artifacts
          locked: true
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: sdist
      - name: Extract source archive
        shell: bash
        run: |
          mkdir source
          tar -xf sdist/*.tar.gz -C source --strip-components=1
      - run: pixi run --locked -e artifacts maturin build --manifest-path source/Cargo.toml --release --locked --compatibility pypi --out dist -i python
      - name: Repair macOS wheels
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pixi run --locked -e artifacts delocate-wheel --require-archs arm64 --wheel-dir wheelhouse dist/*.whl
          mv wheelhouse/*.whl dist/
      - name: Repair Windows wheels
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for wheel in dist/*.whl; do
            pixi run --locked -e artifacts delvewheel repair --wheel-dir wheelhouse "$wheel"
          done
          mv wheelhouse/*.whl dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          overwrite: true
      - run: pixi run --locked -e artifacts twine check --strict dist/*.whl
      - name: Check wheel contents
        shell: bash
        run: pixi run --locked -e artifacts check-wheel-contents --config pyproject.toml dist/*.whl
      - name: Audit Python ABI
        shell: bash
        run: pixi run --locked -e artifacts abi3audit --strict --summary dist/*-cp312-abi3-*.whl
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.22"
          enable-cache: false
          python-version: "3.12"
          activate-environment: true
      - name: Install wheel
        shell: bash
        run: uv pip install pytest dist/*-cp312-abi3-*.whl
      - run: uv pip check
      - name: Test wheel installation
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from importlib.metadata import version
          from importlib.util import find_spec
          from pathlib import Path
          import wesl

          assert wesl.__version__ == version("wesl-py")
          assert Path(wesl.__file__).is_relative_to(sys.prefix)
          assert Path(wesl.__file__).with_name("py.typed").is_file()
          assert Path(wesl.__file__).with_name("_native.pyi").is_file()
          assert "wgpu" not in sys.modules
          assert "fn main(" in wesl.compile_source("@compute @workgroup_size(1) fn main() {}").wgsl
          shader = wesl.compile_source(
              "import wgsl_test::expect; @compute @workgroup_size(1) fn main() { expect(true); }"
          )
          assert "wgsl_test" in shader.modules
          assert find_spec("maturin") is None
          PY
      - name: Test Python API
        run: python -m pytest tests --ignore=tests/examples -q

  test-wheel:
    needs: wheel-linux
    name: Test ${{ matrix.platform.target }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.platform.target }}
          path: dist
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.22"
          python-version: ${{ matrix.python }}
          activate-environment: true
      - run: uv pip install pytest dist/*-cp312-abi3-*.whl
      - run: uv pip check
      - name: Test wheel installation
        run: |
          python - <<'PY'
          import sys
          from importlib.metadata import version
          from importlib.util import find_spec
          from pathlib import Path
          import wesl

          assert wesl.__version__ == version("wesl-py")
          assert Path(wesl.__file__).is_relative_to(sys.prefix)
          assert Path(wesl.__file__).with_name("py.typed").is_file()
          assert Path(wesl.__file__).with_name("_native.pyi").is_file()
          assert "wgpu" not in sys.modules
          assert "fn main(" in wesl.compile_source("@compute @workgroup_size(1) fn main() {}").wgsl
          shader = wesl.compile_source(
              "import wgsl_test::expect; @compute @workgroup_size(1) fn main() { expect(true); }"
          )
          assert "wgsl_test" in shader.modules
          assert find_spec("maturin") is None
          PY
      - run: python -m pytest tests --ignore=tests/examples -q

  compute:
    name: Test GPU integration
    needs: wheel-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WGPU_BACKEND_TYPE: Vulkan
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: dist
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.22"
          python-version: "3.12"
          activate-environment: true
      - name: Install wheel with extra
        run: |
          wheels=(dist/*-cp312-abi3-*.whl)
          uv pip install pytest "${wheels[0]}[testing]"
      - name: Install shader test dependencies
        run: uv pip install numpy pytest-xdist
      - run: uv pip check
      - name: Install Mesa Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - name: Test Python API and GPU integration
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: python -m pytest tests --ignore=tests/examples -q

  examples:
    name: Test examples
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WGPU_BACKEND_TYPE: Vulkan
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.80.0
          environments: testing
          locked: true
      - name: Install Mesa Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - name: Test examples
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: pixi run --locked -e testing python -m pytest tests/examples -q
