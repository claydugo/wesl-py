name: Artifacts

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  WESL_PY_BUILD_REVISION: ${{ github.sha }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
        with:
          pixi-version: v0.80.0
          locked: true
      - run: pixi run --locked lint
      - run: pixi run --locked format-check
      - run: pixi run --locked test-freethreading
      - run: pixi run --locked check-dependencies
      - run: pixi run --locked -e test python -m pytest tests/packaging/test_licenses.py

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
        with:
          pixi-version: v0.80.0
          manifest-path: ci/pixi.toml
          locked: true
      - run: pixi run --locked --manifest-path ci/pixi.toml maturin sdist --out dist
      - run: pixi run --locked --manifest-path ci/pixi.toml twine check --strict dist/*.tar.gz
      - run: pixi run --locked --manifest-path ci/pixi.toml python tests/packaging/check_sdist.py dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheel:
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform-tag: manylinux_2_28_x86_64
          - runner: macos-26
            target: aarch64-apple-darwin
            platform-tag: macosx_11_0_arm64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform-tag: win_amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
        with:
          pixi-version: v0.80.0
          manifest-path: ci/pixi.toml
          locked: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdist
          path: sdist
      - name: Extract source archive
        shell: bash
        run: |
          mkdir source
          tar -xf sdist/*.tar.gz -C source --strip-components=1
      - name: Read locked build tool versions
        if: runner.os == 'Linux'
        id: build-tools
        run: |
          echo "rust=$(pixi run --locked --manifest-path ci/pixi.toml rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
          echo "maturin=$(pixi run --locked --manifest-path ci/pixi.toml maturin --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          maturin-version: v${{ steps.build-tools.outputs.maturin }}
          rust-toolchain: ${{ steps.build-tools.outputs.rust }}
          target: x86_64-unknown-linux-gnu
          manylinux: "2_28"
          docker-options: -e WESL_PY_BUILD_REVISION
          working-directory: source
          args: --release --locked --out ../dist -i python3.12
      - if: runner.os != 'Linux'
        run: pixi run --locked --manifest-path ci/pixi.toml maturin build --manifest-path source/Cargo.toml --release --locked --out dist -i python
      - if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          maturin-version: v${{ steps.build-tools.outputs.maturin }}
          rust-toolchain: ${{ steps.build-tools.outputs.rust }}
          target: x86_64-unknown-linux-gnu
          manylinux: "2_28"
          docker-options: -e WESL_PY_BUILD_REVISION
          working-directory: source
          args: --release --locked --out ../dist -i python3.15
      - if: runner.os != 'Linux'
        run: pixi run --locked --manifest-path ci/pixi.toml -e python315 maturin build --manifest-path source/Cargo.toml --release --locked --out dist -i python
      - name: Repair macOS wheels
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pixi run --locked --manifest-path ci/pixi.toml delocate-wheel --require-archs arm64 --wheel-dir wheelhouse dist/*.whl
          mv wheelhouse/*.whl dist/
      - name: Repair Windows wheels
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for wheel in dist/*.whl; do
            pixi run --locked --manifest-path ci/pixi.toml delvewheel repair --wheel-dir wheelhouse "$wheel"
          done
          mv wheelhouse/*.whl dist/
      - run: pixi run --locked --manifest-path ci/pixi.toml twine check --strict dist/*.whl
      - name: Audit Python ABI
        shell: bash
        run: pixi run --locked --manifest-path ci/pixi.toml abi3audit --strict --summary dist/*-cp312-abi3-*.whl
      - name: Test installed wheel
        shell: bash
        run: |
          pixi run --locked --manifest-path ci/pixi.toml python source/tests/packaging/check_artifact.py dist/*-cp312-abi3-*.whl --python 3.12 --platform-tag ${{ matrix.platform-tag }} --find-links dist --stubtest
          pixi run --locked --manifest-path ci/pixi.toml python source/tests/packaging/check_artifact.py dist/*-cp312-abi3-*.whl --python 3.13 --platform-tag ${{ matrix.platform-tag }} --find-links dist
          pixi run --locked --manifest-path ci/pixi.toml python source/tests/packaging/check_artifact.py dist/*-cp312-abi3-*.whl --python 3.14 --platform-tag ${{ matrix.platform-tag }} --find-links dist
          pixi run --locked --manifest-path ci/pixi.toml python source/tests/packaging/check_artifact.py dist/*-cp312-abi3-*.whl --python 3.15 --platform-tag ${{ matrix.platform-tag }}
          pixi run --locked --manifest-path ci/pixi.toml python source/tests/packaging/check_artifact.py dist/*-cp315-abi3.abi3t-*.whl --python 3.15 --abi-tag cp315-abi3.abi3t --platform-tag ${{ matrix.platform-tag }} --find-links dist
          pixi run --locked --manifest-path ci/pixi.toml python source/tests/packaging/check_artifact.py dist/*-cp315-abi3.abi3t-*.whl --python 3.15t --abi-tag cp315-abi3.abi3t --platform-tag ${{ matrix.platform-tag }} --find-links dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  compute:
    needs: [sdist, wheel]
    if: ${{ !cancelled() && needs.sdist.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      WGPU_BACKEND_TYPE: Vulkan
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
        with:
          pixi-version: v0.80.0
          manifest-path: ci/pixi.toml
          locked: true
      - name: Install Mesa Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdist
          path: sdist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: dist
      - name: Extract source archive
        run: |
          mkdir source
          tar -xf sdist/*.tar.gz -C source --strip-components=1
      - name: Test examples and compute
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: |
          pixi run --locked --manifest-path ci/pixi.toml python source/tests/packaging/check_artifact.py dist/*-cp312-abi3-*.whl --python 3.12 --platform-tag manylinux_2_28_x86_64 --extra examples --compute
      - name: Test pytest integration
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: |
          pixi run --locked --manifest-path ci/pixi.toml python source/tests/packaging/check_artifact.py dist/*-cp312-abi3-*.whl --python 3.12 --platform-tag manylinux_2_28_x86_64 --extra testing --compute
      - name: Test minimum pytest version
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: pixi run --locked --manifest-path pixi.toml -e testing-minimum python -m pytest tests/test_pytest_plugin.py -q
