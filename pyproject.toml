[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "wesl-py"
dynamic = ["version"]
description = "Python bindings for the Rust WESL compiler"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE-MIT", "LICENSE-RUST.html", "NOTICE", "THIRDPARTY.yml"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/claydugo/wesl-py"
Issues = "https://github.com/claydugo/wesl-py/issues"
Changelog = "https://github.com/claydugo/wesl-py/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["ipython"]
compute = ["imageio>=2.37", "numpy", "wgpu>=0.31.1"]
fractal = ["imageio>=2.37", "numpy", "wgpu>=0.31.1"]
examples = [
    "glfw",
    "imageio>=2.37",
    "imgui-bundle>=1.92.900",
    "numpy",
    "pygfx>=0.17",
    "rendercanvas",
    "tifffile",
    "wgpu>=0.31.1",
]

[tool.maturin]
python-source = "python"
module-name = "wesl._native"
locked = true
include = [
    { path = "Cargo.lock", format = "sdist" },
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["compile"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"python/wesl/__init__.py" = ["D103", "D104", "EM101", "PLR0913", "TRY003"]
"tests/*.py" = ["D100", "D103", "INP001", "S101"]
"tools/*.py" = ["D100", "INP001", "S603", "S607"]
"tools/test_*.py" = ["S101"]
"tools/benchmark.py" = ["T201"]
"tools/profile_startup.py" = ["T201"]
"examples/*.py" = ["D100", "D103", "ICN001", "INP001", "S101"]
"examples/*/verify.py" = ["T201"]
"recipe/build.py" = ["D100", "INP001", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a GPU adapter"]
