[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "wesl-py"
dynamic = ["version"]
description = "Python bindings for the Rust WESL compiler"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/claydugo/wesl-py"
Issues = "https://github.com/claydugo/wesl-py/issues"

[project.optional-dependencies]
testing = [
    "pytest>=8.2",
    "wgpu==0.32.0",
]
[project.entry-points.pytest11]
wesl = "wesl.pytest_plugin"

[tool.maturin]
python-source = "python"
module-name = "wesl._native"
locked = true
include = [
    { path = "Cargo.lock", format = "sdist" },
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["compile"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"python/wesl/*.py" = ["D101", "D103", "D104", "EM101", "EM102", "PLR0913", "TRY003"]
"python/wesl/testing.py" = ["D100", "PLR2004"]
"python/wesl/pytest_plugin.py" = ["D100", "D102", "PLC0415"]
"tests/*.py" = ["D100", "D103", "INP001", "S101"]
"tests/test_testing.py" = ["E402", "PLR2004"]
"tests/examples/testing/*.py" = ["ICN001"]
"examples/*.py" = ["D100", "D103", "ICN001", "INP001", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = ["gpu: requires a WebGPU adapter (hardware or software)"]
