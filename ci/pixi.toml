[workspace]
name = "wesl-artifacts"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
rust = "*"
maturin = "*"
abi3audit = "*"
packaging = "*"
pytest = "*"
tomli-w = "*"
twine = "*"

[target.osx-arm64.dependencies]
delocate = "*"

[target.win-64.dependencies]
delvewheel = "*"

[feature.python312.dependencies]
python = "3.12.*"

[feature.python315]
channels = ["conda-forge", "conda-forge/label/python_rc"]

[feature.python315.dependencies]
python = "3.15.*"
python-gil = "*"

[environments]
default = { features = ["python312"] }
python315 = { features = ["python315"] }

[target.osx-arm64.activation.env]
MACOSX_DEPLOYMENT_TARGET = "11.0"
