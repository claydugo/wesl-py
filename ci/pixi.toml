[workspace]
name = "wesl-artifacts"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
rust = "==1.97.1"
maturin = "1.15.*"
abi3audit = "*"
packaging = "*"
pefile = "*"
pyelftools = "*"
twine = "*"

[target.linux-64.dependencies]
auditwheel = ">=6.8.2"

[target.osx-arm64.dependencies]
delocate = ">=0.13"

[target.win-64.dependencies]
delvewheel = ">=1.13.1"

[feature.python312.dependencies]
python = "3.12.*"

[feature.python315]
channels = ["conda-forge", "conda-forge/label/python_rc"]

[feature.python315.dependencies]
python = "3.15.*"
python-gil = "3.15.*"

[environments]
default = { features = ["python312"] }
python315 = { features = ["python315"] }

[target.osx-arm64.activation.env]
MACOSX_DEPLOYMENT_TARGET = "11.0"
